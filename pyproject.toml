[project]
name = "qmodem"
version = "0.1.0"
description = "QMoDeM: Quantum-aided Models for Decision Making."
readme = "README.md"
authors = [
    { name = "debrevitatevitae", email = "giotb92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax-ai-stack>=2025.10.28",
    "mlflow>=3.7.0",
    "optuna>=4.8.0",
    "pennylane>=0.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "simbat",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "docformatter>=1.7.7",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "seaborn>=0.13.2",
]

[tool.docformatter]
recursive = true
black = true
style = "google"

[tool.ruff.lint]
ignore = ["F722"]

[tool.uv.sources]
simbat = { git = "https://github.com/GroupiSP/simbat.git" }

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = false
