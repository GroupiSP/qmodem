[project]
name = "qmodem"
version = "0.2.0"
description = "QMoDeM: Quantum-aided Models for Decision Making."
readme = "README.md"
authors = [
    { name = "debrevitatevitae", email = "giotb92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.2",
    "flax>=0.12.8,<0.12.9",
    "jaxtyping>=0.3.0",
    "jax>=0.10,<0.11",
    "matplotlib>=3.10.0",
    "mlflow>=3.7.0",
    "optax>=0.2.8",
    "optuna>=4.8.0",
    "orbax-checkpoint>=0.12.7",
    "pandas>=2.2.0",
    "pennylane>=0.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "simbat",
    "stagereg[jax]==0.2.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "docformatter>=1.7.7",
    "hypothesis>=6.140.4",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "seaborn>=0.13.2",
]

[tool.docformatter]
recursive = true
black = true
style = "google"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting
ignore = ["F722"]

[tool.ruff.lint.isort]
known-first-party = ["qmodem"]

[tool.uv.sources]
simbat = { git = "https://github.com/GroupiSP/simbat.git" }

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = false
